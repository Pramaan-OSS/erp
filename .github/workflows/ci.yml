name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PRAMAAN_API_KEY: ""
  PRAMAAN_FAKE: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/ci-requirements.txt
      - run: python -m pip install -r review/ci-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - run: npm ci --prefix banking --ignore-scripts --no-audit --no-fund --no-save
      - run: ruff check erpnext
      - run: npm --prefix banking run lint
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - run: npm ci --prefix banking --ignore-scripts --no-audit --no-fund --no-save
      - run: npm --prefix banking exec -- tsc -b banking/tsconfig.json
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/ci-requirements.txt
      - run: python -m pip install -r review/ci-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: python -m unittest discover -s review
      - run: node --test "erpnext/tests/js/**/*.test.mjs"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - run: npm ci --prefix banking --ignore-scripts --no-audit --no-fund --no-save
      - run: npm --prefix banking run build
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ERP_APP_ROOT: ${{ github.workspace }}
      ERP_DB: postgres
      ERP_DB_HOST: 127.0.0.1
      ERP_REDIS_HOST: 127.0.0.1
      ERP_SITE_NAME: postgres.test
      LOCAL_DB_PASSWORD: ci-local-only
      FRAPPE_PRELOAD_DATABASE_DRIVERS: none
    services:
      database:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
      cache:
        image: redis:8.2-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/runtime-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-postgres-uv-${{ hashFiles('review/*requirements.txt', 'review/runtime-lock.txt') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libmariadb-dev pkg-config mariadb-client postgresql-client-16
      - run: python -m pip install uv==0.11.26
      - run: npm install --global --force yarn@1.22.22
      - run: ./review/prepare-local
      - run: .venv/bin/python review/prepare-postgres.py
      - run: .venv/bin/python review/check_payment_account_framework.py
      - run: .venv/bin/python -m unittest discover -s review
      - run: node --test "erpnext/tests/js/**/*.test.mjs"
