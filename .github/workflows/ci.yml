name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PRAMAAN_API_KEY: ""
  PRAMAAN_FAKE: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/ci-requirements.txt
      - run: python -m pip install -r review/ci-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - run: npm ci --prefix banking --ignore-scripts --no-audit --no-fund --no-save
      - run: ruff check erpnext
      - run: npm --prefix banking run lint
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - run: npm ci --prefix banking --ignore-scripts --no-audit --no-fund --no-save
      - run: npm --prefix banking exec -- tsc -b banking/tsconfig.json
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: review/ci-requirements.txt
      - run: python -m pip install -r review/ci-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: python -m unittest discover -s review
      - run: node --test "erpnext/tests/js/**/*.test.mjs"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: banking/package-lock.json
      - run: npm ci --prefix banking --ignore-scripts --no-audit --no-fund --no-save
      - run: npm --prefix banking run build
