services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?Run ./start to generate local settings}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
volumes:
  database:
