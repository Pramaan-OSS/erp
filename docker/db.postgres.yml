services:
  database:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run ./start to generate local settings}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
volumes:
  postgres:
