name: ${ERP_COMPOSE_PROJECT:-erp}
include:
  - path: db.${ERP_DB:-mariadb}.yml
services:
  cache:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - cache:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    image: ${ERP_APP_IMAGE:-erp-app}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # the browser binary ships in the image; sinkhole the download hosts so a
    # run-time download attempt fails loudly instead of reaching the internet
    extra_hosts:
      - "storage.googleapis.com:127.0.0.1"
      - "cdn.playwright.dev:127.0.0.1"
    env_file: ../.env
    environment:
      ERP_DB: ${ERP_DB:-mariadb}
      FRAPPE_PRELOAD_DATABASE_DRIVERS: none
      FRAPPE_BIND_ADDR: 0.0.0.0
      FRAPPE_BENCH_ROOT: /app/.runtime/bench
      NODE_PATH: /app/.runtime/socket/node_modules
      PATH: /app/.venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - sites:/app/.runtime/bench
    depends_on:
      database: {condition: service_healthy}
      cache: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"]
      start_period: 300s
      interval: 5s
      timeout: 10s
      retries: 120
  web:
    image: nginx:1.28-alpine
    ports:
      - "${ERP_LOCAL_PORT:-18010}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/login]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  sites:
  cache:
