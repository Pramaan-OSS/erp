# Same-origin polling GETs can omit Origin. Preserve every explicit Origin
# so the socket server still rejects requests from another site.
map $http_origin $erp_socket_origin {
  default $http_origin;
  "" "$scheme://$http_host";
}
server {
  listen 80;
  client_max_body_size 32m;
  location /socket.io/ {
    proxy_pass http://app:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Origin $erp_socket_origin;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass http://app:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
